<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าออนไลน์ — Mini Online Shop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🛒 ร้านค้าออนไลน์ <span>Mini Online Shop</span></div>
    <nav>
      <a href="/" class="active">จัดการข้อมูล</a>
      <a href="/report">รายงาน</a>
    </nav>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab active" data-entity="customers">👤 ลูกค้า</button>
      <button class="tab" data-entity="products">📦 สินค้า</button>
      <button class="tab" data-entity="orders">🧾 ออเดอร์</button>
    </div>

    <section class="card">
      <div class="card-head">
        <h3>🔍 ค้นหา<span id="searchTitle"></span></h3>
        <button class="btn sm ghost" id="btnClear">↺ ล้างตัวกรอง</button>
      </div>
      <div id="searchFields" class="search-grid"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3><span id="listTitle"></span> <span id="count" class="count"></span></h3>
        <button class="btn add" id="btnAdd">+ เพิ่ม</button>
      </div>
      <div id="status" class="status"></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <div id="formFields"></div>
      <div id="formError" class="form-error hidden"></div>
      <div class="btn-row">
        <button class="btn" id="btnCancel">ยกเลิก</button>
        <button class="btn primary" id="btnSave">บันทึก</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
